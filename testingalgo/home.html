<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <title>KWIC Search Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <p class="brand-name">KWIC Search Engine</p>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="#search">Search</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <section id="search" aria-labelledby="page-title">
            <h1 id="page-title">KWIC Search Engine</h1>
            <p>Search the indexed lines by keyword.</p>

            <form class="search-form" id="searchForm" role="search">
                <label class="sr-only" for="searchInput">Search the indexed content</label>
                <input
                    type="search"
                    id="searchInput"
                    name="query"
                    placeholder="Enter a keyword"
                    autocomplete="off"
                >
                <button id="searchButton" onclick="mastercontrol()" type="submit">Search</button>
            </form>
        </section>

        <section id="about" aria-labelledby="about-title">
            <h2 id="about-title">About</h2>
            <p>Project 1 interim prototype. Built on KWIC Modularization 2 (object-oriented style).</p>
        </section>
    </main>

    <footer class="site-footer">
        <p>CS/SE 6362 Advanced Software Architecture · Team 2</p>
    </footer>
</body>
</html>
